name: Bug report
description: Report behavior that does not match expectations.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Ubuntu 24.04, macOS 15, etc.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go1.26.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and configuration needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, personal data, and other secrets before posting.
      render: text
    validations:
      required: false
