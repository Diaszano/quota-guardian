name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: 'python3 -m venv "$RUNNER_TEMP/pre-commit"'
      - run: '"$RUNNER_TEMP/pre-commit/bin/python" -m pip install pre-commit==4.6.2'
      - run: '"$RUNNER_TEMP/pre-commit/bin/python" -m pre_commit run --all-files'
      - run: git diff --exit-code
      - run: make check
