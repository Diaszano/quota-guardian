name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: 'python3 -m venv "$RUNNER_TEMP/pre-commit"'
      - run: '"$RUNNER_TEMP/pre-commit/bin/python" -m pip install pre-commit==4.6.2'
      - run: '"$RUNNER_TEMP/pre-commit/bin/python" -m pre_commit run --all-files'
      - run: git diff --exit-code
      - run: make check
